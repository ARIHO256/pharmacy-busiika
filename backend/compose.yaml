name: mydoctor
x-app: &app
  build: .
  env_file: .env
  environment:
    DJANGO_DEBUG: "false"
    DB_ENGINE: django.db.backends.postgresql
    DB_HOST: postgres
    DB_NAME: mydoctor
    DB_USER: mydoctor
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    DB_SSLMODE: disable
    REDIS_URL: redis://redis:6379/0
    CLAMAV_HOST: clamav
  volumes:
    - private-media:/app/private-media
    - public-media:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
services:
  api:
    <<: *app
    ports: ["127.0.0.1:4000:4000"]
  worker:
    <<: *app
    command: celery -A config worker --loglevel=INFO --concurrency=2
  scheduler:
    <<: *app
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mydoctor
      POSTGRES_USER: mydoctor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydoctor -d mydoctor"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  clamav:
    image: clamav/clamav:stable
    volumes: ["clamav:/var/lib/clamav"]
    restart: unless-stopped
volumes:
  database:
  redis:
  clamav:
  private-media:
  public-media:
