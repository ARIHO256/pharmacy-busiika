global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: mydoctor-backend
    metrics_path: /api/v1/enterprise/metrics/
    params:
      token: ["change-this-metrics-token"]
    static_configs:
      - targets: ["backend:4000"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
