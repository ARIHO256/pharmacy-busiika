name: HealthPilot CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: healthpilot_test
          POSTGRES_USER: healthpilot
          POSTGRES_PASSWORD: healthpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U healthpilot -d healthpilot_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Django checks, migrations and tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          DJANGO_DEBUG: "false"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: healthpilot_test
          DB_USER: healthpilot
          DB_PASSWORD: healthpilot
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          CSRF_TRUSTED_ORIGINS: http://localhost:3000
        run: |
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build

  static-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static validation gate
        run: bash scripts/validate-static.sh
