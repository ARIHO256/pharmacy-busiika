name: mydoctor-healthos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydoctor}
      POSTGRES_USER: ${POSTGRES_USER:-mydoctor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mydoctor} -d ${POSTGRES_DB:-mydoctor}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-this-redis-password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change-this-redis-password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mydoctor-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-mydoctor-minio} ${MINIO_ROOT_PASSWORD:-change-this-minio-password};
      mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-mydoctor-private};
      mc anonymous set none local/${AWS_STORAGE_BUCKET_NAME:-mydoctor-private};
      mc version enable local/${AWS_STORAGE_BUCKET_NAME:-mydoctor-private};
      exit 0;"
    restart: "no"

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  orthanc:
    image: orthancteam/orthanc:latest
    environment:
      ORTHANC_JSON: /etc/orthanc/orthanc.json
    volumes:
      - orthanc_data:/var/lib/orthanc/db
      - ./deploy/orthanc.json:/etc/orthanc/orthanc.json:ro
    ports:
      - "8042:8042"
      - "4242:4242"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8042/system"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.3.9
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "19092:19092"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers=redpanda:9092 | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-mydoctor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-this-rabbitmq-password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env.compose
    environment: &backend_environment
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-mydoctor}
      DB_USER: ${POSTGRES_USER:-mydoctor}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      DB_HOST: postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-change-this-redis-password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-change-this-redis-password}@redis:6379/1
      CHANNEL_REDIS_URL: redis://:${REDIS_PASSWORD:-change-this-redis-password}@redis:6379/2
      USE_S3: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mydoctor-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-mydoctor-private}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_S3_ADDRESSING_STYLE: path
      CLAMAV_ENABLED: "true"
      CLAMAV_REQUIRED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      KAFKA_REST_PROXY_URL: http://redpanda:8082
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-mydoctor}:${RABBITMQ_DEFAULT_PASS:-change-this-rabbitmq-password}@rabbitmq:5672/%2F
      ORTHANC_BASE_URL: http://orthanc:8042
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      orthanc:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped

  worker:
    build: ./backend
    entrypoint: []
    command: celery -A config worker -l INFO --concurrency=${CELERY_CONCURRENCY:-4} --max-tasks-per-child=1000
    env_file: .env.compose
    environment: *backend_environment
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  beat:
    build: ./backend
    entrypoint: []
    command: celery -A config beat -l INFO --scheduler celery.beat:PersistentScheduler
    env_file: .env.compose
    environment: *backend_environment
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  flower:
    build: ./backend
    entrypoint: []
    command: celery -A config flower --port=5555 --basic-auth=${FLOWER_BASIC_AUTH:-admin:change-me}
    env_file: .env.compose
    environment: *backend_environment
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_started
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
  orthanc_data:
  redpanda_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
